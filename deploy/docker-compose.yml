# CLIENT STACK — one per client, in its own folder on the VPS (/srv/clients/liquor).
# Contains only the app: Postgres and Caddy live in the shared platform stack, so
# restarting or rolling back this client never touches the others.
#
#   cd /srv/clients/liquor && docker compose up -d --build
#
# No ports are published. The only way in is Caddy, over TLS.

name: liquor-pos

services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    image: liquor-pos:latest
    container_name: liquor-pos-app     # must match the reverse_proxy target in the Caddyfile
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 3001
      # Container-to-container on a private Docker network — no TLS to Postgres.
      # (Heroku needed ssl=true with a self-signed chain; that does not apply here.)
      DATABASE_SSL: "false"
    networks:
      - web    # reachable by Caddy
      - data   # can reach Postgres
    logging:
      driver: json-file
      options:
        max-size: "10m"      # without this one chatty container eventually fills the disk
        max-file: "3"

networks:
  web:
    external: true
  data:
    external: true
