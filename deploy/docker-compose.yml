# CLIENT STACK — one per client, in its own folder on the VPS (/srv/clients/<key>).
# Contains only the app: Postgres and Caddy live in the shared platform stack, so
# restarting or rolling back this client never touches the others.
#
#   cd /srv/clients/dukkan/deploy && docker compose up -d
#
# No ports are published. The only way in is Caddy, over TLS.
#
# NOTHING CLIENT-SPECIFIC IS HARDCODED HERE. Every shop runs this identical file; what
# differs is the .env beside it. That is what lets `new-client.sh` scaffold a shop in
# seconds, and what stops the failure this file used to invite: two clients copied from a
# template both claiming the image tag `liquor-pos:latest` and the container name
# `liquor-pos-app`, where the second `docker compose up` silently adopts the first shop's
# image and collides on the name.
#
# PULLS, DOES NOT BUILD. The bundle became client-agnostic when the shop's identity moved to
# runtime config (server/clientConfig.js), so one image built once in CI serves every client.
# Building here instead meant an `npm ci` and a React build per shop on the VPS — 2-4GB of
# webpack each, and forty minutes to onboard shop number twenty-five.
#
# To build locally anyway (no registry, or testing an unreleased change):
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build

name: ${CLIENT_KEY:?set CLIENT_KEY in deploy/.env — it names this stack and its container}-pos

services:
  app:
    # PIN A REAL TAG, never `latest`. With one image serving every shop, `latest` means an
    # unrelated `docker compose up` — or a restart after a host reboot — can silently move a
    # shop onto a build nobody chose for it. A pinned tag makes upgrading a shop a deliberate
    # edit, lets you roll one client back without touching the other twenty-nine, and makes
    # "which build is this till running?" answerable.
    image: ${POS_IMAGE:?set POS_IMAGE in deploy/.env, e.g. ghcr.io/<owner>/liquor-store-pos:v1.4.0}
    container_name: ${CLIENT_KEY}-pos-app     # must match the reverse_proxy target in the Caddyfile
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 3001
      # Container-to-container on a private Docker network — no TLS to Postgres.
      # (Heroku needed ssl=true with a self-signed chain; that does not apply here.)
      DATABASE_SSL: "false"
      # Node does NOT read the container's memory limit. Left alone, V8 grows its heap
      # toward its own default (~4GB on 64-bit), sails past mem_limit, and the kernel OOM
      # -kills the process INSTEAD of V8 running a garbage collection — a crash where a GC
      # pause belonged. Cap the heap below the container limit; the gap covers the C++
      # heap, Buffers and thread stacks.
      NODE_OPTIONS: "--max-old-space-size=200"
    # RESOURCE LIMITS — the multi-tenant rule that is skipped and then learned the hard way.
    # Every shop on this box shares one kernel. Without a ceiling, ONE shop's memory leak or
    # runaway import takes the host down and every OTHER shop stops selling with it. The
    # limit converts "all thirty tills are dead" into "one till restarted".
    #
    # 256m suits this app: a static CRA bundle served off disk plus a small Express API.
    # Measure with `docker stats` before raising it — if a shop needs more, that is a
    # finding, not a number to bump.
    mem_limit: 256m
    memswap_limit: 256m    # no swap escape hatch; without it the limit is only advisory
    cpus: 0.5
    networks:
      - web    # reachable by Caddy
      - data   # can reach Postgres
    logging:
      driver: json-file
      options:
        max-size: "10m"      # without this one chatty container eventually fills the disk
        max-file: "3"

networks:
  web:
    external: true
  data:
    external: true
