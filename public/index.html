<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
    <meta name="theme-color" content="#0f1117"/>
    <title>Liquor Store POS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=DM+Sans:wght@400;600;700;800&display=swap" rel="stylesheet"/>
    <style>
      *{margin:0;padding:0;box-sizing:border-box;}
      /* These variables are the page frame — body background and scrollbars — and src/theme.js
         overwrites them on <html> as soon as the bundle loads. The values here are only the
         PRE-BUNDLE default, so they follow the OS: without that, a shop on the day theme
         flashes a dark page for one frame on every load. (No inline <script> can set this
         earlier: the CSP allows script-src 'self' only, by design.) */
      :root{--bg:#0f1117;--text:#e6e6e6;--accent:#f0a830;--scroll-thumb:#2c2f3a;--scroll-thumb-hover:#3a3e4d;}
      @media (prefers-color-scheme: light){
        :root{--bg:#f2f4f7;--text:#161922;--accent:#e09a22;--scroll-thumb:#c3c9d2;--scroll-thumb-hover:#a8b0bc;}
      }
      body{background:var(--bg);color:var(--text);font-family:'DM Sans','Cairo',system-ui,sans-serif;}
      [dir="rtl"], [dir="rtl"] *{font-family:'Cairo','DM Sans',system-ui,sans-serif;}
      /* Touch feedback: every button presses down, hoverable ones lighten */
      button{transition:transform .08s ease, filter .12s ease, box-shadow .12s ease;}
      button:active{transform:scale(.96);}
      @media (hover:hover){ button:hover{filter:brightness(1.12);} }
      button:disabled{cursor:not-allowed;}
      /* Slim dark scrollbars */
      ::-webkit-scrollbar{width:8px;height:8px;}
      ::-webkit-scrollbar-track{background:transparent;}
      ::-webkit-scrollbar-thumb{background:var(--scroll-thumb);border-radius:8px;}
      ::-webkit-scrollbar-thumb:hover{background:var(--scroll-thumb-hover);}
      /* Entry animations */
      @keyframes rise{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
      .rise{animation:rise .25s ease both;}
      /* Notifications: slide in from the edge they live on, and drain a timer bar for exactly
         as long as the toast is on screen (duration comes from the component). */
      @keyframes toast-in{from{opacity:0;transform:translateX(24px) scale(.97);}to{opacity:1;transform:none;}}
      @keyframes toast-drain{from{width:100%;}to{width:0;}}
      .toast-in{animation:toast-in .26s cubic-bezier(.16,1,.3,1) both;}
      [dir="rtl"] .toast-in{animation-name:toast-in-rtl;}
      @keyframes toast-in-rtl{from{opacity:0;transform:translateX(-24px) scale(.97);}to{opacity:1;transform:none;}}
      /* Motion is decoration here; the message is the content. Honour the OS setting. */
      @media (prefers-reduced-motion:reduce){
        .toast-in{animation:none;}
        .rise{animation:none;}
      }
      /* The sync light, while a flush is in flight. Only the SYNCING state animates: motion
         on the resting state would make the thing cashiers are meant to stop noticing the
         most noticeable element on the screen. */
      @keyframes sync-pulse{0%,100%{opacity:1;}50%{opacity:.25;}}
      @media (prefers-reduced-motion:reduce){ [style*="sync-pulse"]{animation:none !important;} }
      input:focus{border-color:var(--accent) !important;box-shadow:0 0 0 2px rgba(240,168,48,.2);}
      /* The night theme lightens a button on hover; on a white panel that washes it out, so
         day darkens instead. */
      @media (hover:hover){ :root[data-theme="day"] button:hover{filter:brightness(.94);} }
    </style>
    <!-- This shop's identity — name, VAT rate, receipt header, timezone — served by the API
         at runtime (server/clientConfig.js) so ONE build serves every client. It sets
         window.__CLIENT__, which src/client.config.js merges over its baked-in defaults.

         Deliberately a plain blocking <script src>, not defer/async and not inline:
           · inline would be blocked — script-src is 'self' with no 'unsafe-inline', which
             is what stops an XSS reading the session token out of localStorage;
           · blocking-in-head runs BEFORE CRA's deferred bundle, so the config is present
             the moment client.config.js evaluates. defer here would be a race the app
             loses roughly never, which is the worst frequency for a bug.
         Absolute path, so it still resolves when the SPA catch-all serves this shell for a
         deep link. If it 404s (a static demo build with no API), the app falls back to the
         defaults in src/client.config.js and boots fine. -->
    <script src="/client-config.js"></script>
      <link rel="manifest" href="%PUBLIC_URL%/manifest.json"/>
    <link rel="icon" href="%PUBLIC_URL%/icons/icon-192.png"/>
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/icons/icon-512.png"/>
    <meta name="mobile-web-app-capable" content="yes"/>
    <meta name="apple-mobile-web-app-capable" content="yes"/>
    <meta name="apple-mobile-web-app-title" content="Liquor Store"/>
</head>
  <body>
    <div id="root"></div>
  </body>
</html>
