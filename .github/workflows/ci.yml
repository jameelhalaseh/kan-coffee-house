name: CI

# The suite is worth nothing if it only runs when someone remembers. This runs both halves
# on every push and PR: the jsdom tests (pure helpers, CSV parsing) and the server tests,
# which need a real Postgres because what they assert is transactions, unique constraints
# and row locks.
on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine        # same major as production (deploy/platform)
        env:
          POSTGRES_USER: pos
          POSTGRES_PASSWORD: pos
          POSTGRES_DB: liquorpos
        ports:
          - 5433:5432
        # Don't start the suite against a database still booting.
        options: >-
          --health-cmd "pg_isready -U pos"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      # globalSetup creates and migrates liquorpos_test on this server per run.
      TEST_DATABASE_URL: postgres://pos:pos@localhost:5433/liquorpos_test
      DATABASE_SSL: 'false'
      # The shop's trading-day clock. The browser is told this value at runtime
      # (server/clientConfig.js), so it is the single source rather than something that has
      # to be kept level with a literal in the bundle — but the trading-day tests still
      # assert against the UTC+3 midnight boundary, so it must be set here.
      STORE_TZ: Asia/Amman
      CI: 'true'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      # `npm ci` needs the lockfile to match package.json — that check is itself useful.
      - name: Install dependencies
        run: npm ci

      - name: Frontend tests
        run: npx react-scripts test --watchAll=false

      - name: Server tests
        run: npm run test:server

      # A green suite against a build that doesn't compile is a false pass. INLINE_RUNTIME_CHUNK
      # stays false here for the same reason production sets it: the CSP forbids inline scripts.
      - name: Production build
        run: npm run build

      # The repo has been scanned clean; this keeps it that way rather than trusting review.
      - name: Check for committed secrets
        run: |
          if git ls-files | grep -E '(^|/)\.env$'; then
            echo "::error::A .env file is tracked by git"
            exit 1
          fi
          if git grep -nIE '(sk-[A-Za-z0-9]{20,}|nvapi-[A-Za-z0-9_-]{20,}|AKIA[0-9A-Z]{16}|-----BEGIN [A-Z ]*PRIVATE KEY)' -- . ':!*.yml'; then
            echo "::error::Possible secret committed"
            exit 1
          fi
          echo "No secrets found."

  # ── Publish the one image every client runs ─────────────────────────────────
  # The bundle stopped being client-specific when shop identity moved to runtime config
  # (server/clientConfig.js), so there is exactly ONE image and it is built here, once,
  # instead of on the VPS once per shop.
  #
  # `needs: test` is the point of doing it in CI at all: an image that reaches a shop's till
  # has passed the suite by construction, rather than because whoever ran the build
  # remembered to run the tests first.
  publish:
    needs: test
    # Only from main, and never from a pull request — a fork's PR must not be able to
    # publish an image that clients pull.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write        # the only write scope needed; GITHUB_TOKEN is scoped per-run

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tags: the commit sha is the one clients PIN. `main` is a moving pointer for staging
      # and for "what is newest", and deliberately not called `latest` — a client stack that
      # accidentally pins a moving tag would silently change build on any restart, which is
      # exactly the failure the pinned tag in deploy/docker-compose.yml exists to prevent.
      - name: Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=long,prefix=
            type=raw,value=main
            type=semver,pattern=v{{version}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Layer cache in the registry, so a change to server/ does not re-run `npm ci`
          # and the whole React build from scratch.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Show what to pin
        run: |
          echo "Pin this in a client's deploy/.env:"
          echo "  POS_IMAGE=ghcr.io/${{ github.repository }}:${{ github.sha }}"
